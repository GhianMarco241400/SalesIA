services:
  - type: web
    name: nexodigital
    runtime: bun
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: VITE_API_URL
        sync: false
